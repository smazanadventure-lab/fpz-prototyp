# Test dymny wdrożenia: po każdej zmianie na main sprawdza, czy strony końcówek i API odpowiadają na serwerze.
name: Test dymny wdrożenia

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BASE: ${{ vars.FPZ_API_BASE || 'https://fpz-prototyp.netlify.app' }}
    steps:
      - name: Czekaj na wdrożenie Netlify
        if: github.event_name == 'push'
        run: sleep 80

      - name: Strony końcówek
        run: |
          fail=""
          for p in / /app /www /kiosk/TZ.T1.1 /lcd/LCD-01 /bileter /cms /ekspozycja /nadawanie /kody /q/FPZ-Q-101 /manifest.webmanifest; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$BASE$p")
            echo "$p -> $code"
            if [ "$code" != "200" ]; then echo "::error::$p zwraca $code"; fail=1; fi
          done
          for f in FPZ-prototyp-wersja-testowa.html FPZ-kody-QR-do-testow.pdf FPZ-kiosk-windows.zip; do
            out=$(curl -s -L -o /dev/null -D - -w 'kod=%{http_code} rozmiar=%{size_download} adres=%{url_effective}' "$BASE/pobierz/$f"); code=$(echo "$out" | grep -o 'kod=[0-9]*' | cut -d= -f2); size=$(echo "$out" | grep -o 'rozmiar=[0-9]*' | cut -d= -f2); disp=$(echo "$out" | grep -i '^content-disposition' | tr -d '\r' | tail -1); ctype=$(echo "$out" | grep -i '^content-type' | tr -d '\r' | tail -1); final=$(echo "$out" | grep -o 'adres=.*' | cut -d= -f2)
            echo "::notice title=Pliki do pobrania::/pobierz/$f -> $code, $size B, ${disp:-brak Content-Disposition}, $ctype, adres końcowy: $final"
            if [ "$code" != "200" ] || [ "${size:-0}" -lt 10000 ] || ! echo "$disp" | grep -qi attachment; then echo "::error::/pobierz/$f: kod $code, $size B, ${disp:-brak Content-Disposition}"; fail=1; fi
          done
          echo "::notice::Strony: $([ -z "$fail" ] && echo 'wszystkie adresy odpowiadają 200' || echo 'są błędy')"
          [ -z "$fail" ]

      - name: API
        run: |
          body=$(curl -s "$BASE/api/info")
          echo "::notice::api/info $body"
          echo "$body" | grep -q '"ok":true'
          app=$(curl -s "$BASE/api/sync?role=app&device=smoke" | head -c 400000)
          echo "$app" | grep -q '"entries"' || { echo "::error::brak danych w /api/sync"; exit 1; }
          if echo "$app" | grep -q '"staff"'; then echo "::error::widok aplikacji zawiera dane zaplecza"; exit 1; fi
          echo "::notice::Widok aplikacji: dane publiczne są, danych zaplecza brak"

      - name: Pliki multimedialne i sygnały urządzeń
        run: |
          id="m-smoke-${{ github.run_id }}"
          printf 'FPZ-SMOKE-0123456789' > part.bin
          up=$(curl -s -X POST --data-binary @part.bin "$BASE/api/media/$id?part=0&parts=1&size=20&type=image/png&name=smoke.png")
          echo "$up" | grep -q '"done":true' || { echo "::error::wgranie pliku: $up"; exit 1; }
          rng=$(curl -s -o out.bin -w '%{http_code}' -H 'Range: bytes=4-8' "$BASE/api/media/$id")
          [ "$rng" = "206" ] && [ "$(cat out.bin)" = "SMOKE" ] || { echo "::error::odczyt zakresu: HTTP $rng, treść '$(cat out.bin)'"; fail=1; }
          curl -s -X DELETE "$BASE/api/media/$id" > /dev/null
          gone=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/media/$id")
          [ "$gone" = "404" ] || { echo "::error::plik testowy nie został usunięty (HTTP $gone)"; fail=1; }
          beat=$(curl -s -X POST -H 'content-type: application/json' -d '{"id":"SMOKE-TEST","src":"page","kind":"test"}' "$BASE/api/beat")
          echo "$beat" | grep -q '"ok":true' || { echo "::error::sygnał urządzenia: $beat"; fail=1; }
          pres=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/presence")
          dev=$(curl -s "$BASE/api/device/TZ.T1.1")
          echo "$dev" | grep -q '"power"' || { echo "::error::stan urządzenia: $dev"; fail=1; }
          [ "$pres" = "200" ] || { echo "::error::/api/presence zwraca $pres"; fail=1; }
          echo "::notice::Pliki (wgranie, zakres 206, usunięcie) i sygnały urządzeń: $([ -z "$fail" ] && echo 'działają' || echo 'są błędy'); urządzenie TZ.T1.1: $dev"
          [ -z "$fail" ]
