# Sprawdzenie integracji z prawdziwym środowiskiem testowym Tpay (sandbox): token, utworzenie i odczyt transakcji,
# certyfikaty powiadomień. Nie wykonuje żadnej płatności. Uruchamiany ręcznie (Actions → „Tpay sandbox” → Run workflow).
# Uwaga: zapora sandboxa Tpay odrzuca połączenia z maszyn GitHub Actions (HTTP 403) – wtedy test kończy się ostrzeżeniem,
# a miarodajne jest sprawdzenie z serwera systemu: https://<adres>/api/pay/check (pola „reach” i „auth”).
#
# Klucze: sekrety repozytorium TPAY_CLIENT_ID / TPAY_CLIENT_SECRET (własne konto sandbox). Gdy ich nie ma, test używa
# publicznych kluczy demonstracyjnych, które Tpay podaje w dokumentacji swojej biblioteki
# (https://github.com/tpay-com/tpay-openapi-php – README, sekcja o danych do sandboxa).
name: Tpay sandbox
on:
  workflow_dispatch:
  push:
    branches: [tpay]
    paths: ['server/tpay.mjs', 'test/tpay-live.mjs', '.github/workflows/tpay-sandbox.yml']
jobs:
  tpay-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Dostępność sandboxa z tej maszyny (kody HTTP)
        run: |
          for u in https://secure.sandbox.tpay.com/x509/tpay-jws-root.pem https://openapi.sandbox.tpay.com/ https://secure.tpay.com/x509/tpay-jws-root.pem https://api.tpay.com/; do
            a=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$u"); b=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36' "$u"); c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -A 'fpz-prototyp/0.5' "$u")
            echo "::notice title=Tpay dostępność::$u → curl: $a, UA przeglądarki: $b, UA fpz-prototyp: $c"
          done
          t=$(curl -s -o /tmp/auth.txt -w '%{http_code}' --max-time 15 -X POST https://openapi.sandbox.tpay.com/oauth/auth -H 'content-type: application/x-www-form-urlencoded' -H 'accept: application/json' --data "client_id=$TPAY_CLIENT_ID&client_secret=$TPAY_CLIENT_SECRET"); echo "::notice title=Tpay dostępność::POST /oauth/auth (curl) → $t, początek odpowiedzi: $(head -c 120 /tmp/auth.txt | tr -d '\n' | sed 's/access_token\":\"[^\"]*/access_token\":\"…/')"
          echo "::notice title=Tpay dostępność::adres wychodzący maszyny: $(curl -s --max-time 10 https://api.ipify.org || echo '?')"
        env:
          TPAY_CLIENT_ID: ${{ secrets.TPAY_CLIENT_ID || '1010-e5736adfd4bc5d8c' }}
          TPAY_CLIENT_SECRET: ${{ secrets.TPAY_CLIENT_SECRET || '493e01af815383a687b747675010f65d1eefaeb42f63cfe197e7b30f14a556b7' }}
      - name: Token, transakcja, odczyt, certyfikaty
        env:
          TPAY_ENV: sandbox
          TPAY_CLIENT_ID: ${{ secrets.TPAY_CLIENT_ID || '1010-e5736adfd4bc5d8c' }}
          TPAY_CLIENT_SECRET: ${{ secrets.TPAY_CLIENT_SECRET || '493e01af815383a687b747675010f65d1eefaeb42f63cfe197e7b30f14a556b7' }}
        run: node test/tpay-live.mjs
